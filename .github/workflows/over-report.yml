name: Overall Performance Report
on:
  schedule:
    # 01:45 UTC = 07:15 AM IST (Actions cron late chalta hai, buffer rakha hai)
    - cron: "45 1 * * *"
  workflow_dispatch:
concurrency:
  group: overall-performance-report
  cancel-in-progress: false
jobs:
  run-report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Overall Performance Report (auto-retry on failure)
        uses: nick-fields/retry@v3
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_PORT: ${{ secrets.DB_PORT }}
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          WA_TOKEN: ${{ secrets.WA_TOKEN }}
          WA_PHONE_ID: ${{ secrets.WA_PHONE_ID }}
          WA_RECIPIENTS: ${{ secrets.WA_RECIPIENTS }}
        with:
          timeout_minutes: 8
          max_attempts: 5
          retry_wait_seconds: 120
          command: python Over_Performance_Report.py